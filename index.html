<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gram-Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sky:#CDE8F6;--sky2:#A9D6F0;--bg:#F6EEDF;--bg2:#EADFC8;--card:#fff;--mint:#BDE5CF;--sun:#FFE9A8;--coral:#FFB8A8;--ink:#2F4858}
@media(prefers-color-scheme:dark){:root{--sky:#27414f;--sky2:#3a6075;--bg:#1d2a33;--bg2:#2b3b46;--card:#25353f;--ink:#EAF2F6}}
*,*:before,*:after{box-sizing:inherit}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--sky);padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;z-index:5;transition:transform .2s;overflow:auto}
#side h1{font-size:21px;margin:0 0 10px}.nav{font:inherit;font-weight:800;text-align:left;border:0;background:none;color:inherit;padding:11px 14px;border-radius:16px;cursor:pointer}.nav:hover{background:var(--card)}.off{opacity:.55}
#burger{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:6;font-size:22px;border:0;border-radius:16px;background:var(--sky2);padding:8px 14px;color:var(--ink)}
main{margin-left:230px;padding:26px;max-width:860px}.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px rgba(47,72,88,.12)}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:11px 18px;min-height:46px;background:var(--sky2);color:var(--ink);cursor:pointer;margin:2px}.go{background:var(--mint)}.opt{display:block;width:100%;text-align:left}.sel{background:var(--sun)}
input,select,textarea{font:inherit;width:100%;padding:11px;border-radius:16px;border:2px solid var(--sky2);background:var(--card);color:var(--ink);margin:3px 0}
.ok{background:var(--mint);border-radius:12px;padding:8px 12px;color:#2F4858}.bad{background:var(--coral);border-radius:12px;padding:8px 12px;color:#2F4858}.vi{background:var(--sun);border-radius:12px;padding:8px 12px;margin-top:6px;color:#2F4858}
table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid var(--bg2)}.w{overflow-x:auto}
@media(max-width:760px){#side{transform:translateX(-100%)}#side.open{transform:none}#burger{display:block}main{margin-left:0;padding:62px 14px 26px}}
</style></head><body>
<button id="burger" aria-label="Menu">☰</button><nav id="side"></nav><main id="app"></main>
<script>
// ---- CONFIG: only edit here ----
const APP_NAME="Gram-Buddy",SB_URL="https://tfycdgtokatamvsivqgf.supabase.co",SB_KEY="sb_publishable_TeI4Gw0jo_zzfrd7PI5xZg_6JFvkzYG";
const SB=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),A=$("#app"),side=$("#side");
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
const h=x=>{A.innerHTML=x;scrollTo(0,0)};
const bind=(sel,f)=>A.querySelectorAll(sel).forEach(b=>b.onclick=()=>f(b));
const err=r=>{if(r.error){alert("Error: "+r.error.message);throw r.error}return r.data};
let me={};try{me=JSON.parse(localStorage.getItem("gb")||"{}")}catch(x){}
$("#burger").onclick=()=>side.classList.toggle("open");
function nav(items,extra=""){side.innerHTML=`<h1>🌱 ${APP_NAME}</h1>`;items.forEach(([l,f])=>{const b=document.createElement(f?"button":"span");b.className="nav"+(f?"":" off");b.textContent=l;if(f)b.onclick=()=>{side.classList.remove("open");f()};side.append(b)});side.insertAdjacentHTML("beforeend",extra)}
// ---------- STUDENT ----------
const sNav=()=>nav([["Home",home],["Level: A2+ (active)",0],["A2 – Coming soon",0],["B1 – Coming soon",0],["Units",home],["My Results",results],["Writing Corner",writing],["Help",help]],`<div style="margin-top:auto;font-size:14px">${e(me.name)} · ${e(me.cls)}<br><a href="#" id="chg" style="color:inherit">Not you? Change</a></div>`);
function sBind(){const c=$("#chg");if(c)c.onclick=ev=>{ev.preventDefault();me={};try{localStorage.removeItem("gb")}catch(x){}who()}}
async function who(){nav([]);const cl=err(await SB.from("classes").select("name").order("name"));
h(`<div class="card"><h2>Who are you?</h2><p>Write your name and choose your class.</p><input id="n" placeholder="Full name" autocomplete="name"><select id="c"><option value="">Choose your class</option>${cl.map(c=>`<option>${e(c.name)}</option>`).join("")}</select><p id="m" class="bad" hidden>Please write your name and choose your class.</p><button class="btn go" id="ok">Start</button></div>`);
$("#ok").onclick=()=>{const n=$("#n").value.trim().replace(/\s+/g," ").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()),c=$("#c").value;if(!n||!c){$("#m").hidden=false;return}me={name:n,cls:c};try{localStorage.setItem("gb",JSON.stringify(me))}catch(x){}home()}}
async function home(){sNav();sBind();const u=err(await SB.from("units").select("*").eq("published",true).order("pos").order("id"));
h(`<h2>Hello, ${e(me.name.split(" ").pop())}!</h2><p>Level A2+ · Gold Experience</p>`+(u.map(x=>`<div class="card"><b>${e(x.title)}</b><p><button class="btn go" data-u="${x.id}">Open unit</button></p></div>`).join("")||"<p>No units yet.</p>"));
bind("[data-u]",b=>unit(+b.dataset.u))}
async function unit(id){sNav();sBind();const u=err(await SB.from("units").select("*").eq("id",id).single()),s=err(await SB.from("sets").select("*").eq("unit_id",id).order("level").order("id")),at=err(await SB.from("attempts").select("set_id,pct"));
h(`<h2>${e(u.title)}</h2><div class="card"><b>Grammar video</b><p>${u.video?`<iframe src="${e(u.video)}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:16px" allowfullscreen></iframe>`:"No video yet."}</p></div><div class="card"><b>Grammar notes</b><p>${e(u.notes||"")}</p></div><h3>Exercise sets (try in this order)</h3>`+s.map(x=>{const m=at.filter(a=>a.set_id===x.id);return `<div class="card">${["🌱","🌿","🌳"][x.level-1]||"🌱"} <b>${e(x.title)}</b>${m.length?` · best ${Math.max(...m.map(a=>a.pct))}% · ${m.length} tries`:""}<p><button class="btn go" data-s="${x.id}">Start</button></p></div>`).join("")+(u.writing_title?`<button class="btn" id="w">Writing task</button>`:""));
bind("[data-s]",b=>play(s.find(x=>x.id==b.dataset.s)));if($("#w"))$("#w").onclick=()=>writeTask(u)}
async function play(s){sNav();sBind();const q=err(await SB.from("questions").select("*").eq("set_id",s.id).order("pos").order("id"));
h(`<h2>${e(s.title)}</h2>`+q.map((x,i)=>`<div class="card"><b>${i+1}. ${e(x.prompt)}</b><div>${x.type==="fill"?`<input aria-label="Answer">`:(x.type==="tf"?["True","False"]:x.options||[]).map(o=>`<button class="btn opt" data-v="${e(o)}">${e(o)}</button>`).join("")}</div><div class="fb"></div></div>`).join("")+`<button class="btn go" id="chk">Check answers</button>`);
A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));b.classList.add("sel")});
$("#chk").onclick=async()=>{let r=0;A.querySelectorAll(".card").forEach((c,i)=>{const x=q[i],v=x.type==="fill"?c.querySelector("input").value:(c.querySelector(".sel")?.dataset.v||""),ok=(x.answers||[]).some(a=>norm(a)===norm(v));if(ok)r++;c.querySelector(".fb").innerHTML=`<p class="${ok?"ok":"bad"}">${ok?"Correct!":"Not yet."} Your answer: ${e(v||"(empty)")}${ok?"":" · Correct answer: "+e((x.answers||[])[0])}</p><p class="vi">${e(x.explanation_vi||"")}</p>`});
const p=Math.round(r/q.length*100),k=err(await SB.from("attempts").select("id",{count:"exact"}).eq("set_id",s.id)).length+1;
err(await SB.from("attempts").insert({name:me.name,class:me.cls,set_id:s.id,set_title:s.title,correct:r,total:q.length,pct:p,try:k}));
$("#chk").outerHTML=`<div class="card"><h3>${p}% · ${r}/${q.length} correct · try ${k}</h3><button class="btn" id="a">Try again</button><button class="btn go" id="b">Back to unit</button></div>`;$("#a").onclick=()=>play(s);$("#b").onclick=()=>unit(s.unit_id);if(p===100)confetti()}}
async function results(){sNav();sBind();const a=err(await SB.from("attempts").select("*").order("created_at",{ascending:false})),tot=err(await SB.from("sets").select("id")).length,d=new Set(a.map(x=>x.set_id)).size,p=tot?Math.round(d/tot*100):0,hh=20+p*1.2;
h(`<h2>My Results</h2><div class="card" style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 120 140" width="100" role="img" aria-label="Plant"><rect x="35" y="112" width="50" height="24" rx="6" fill="#EADFC8" stroke="#2F4858"/><path d="M60 112V${112-hh}" stroke="#2F4858" stroke-width="5"/><ellipse cx="46" cy="${112-hh*.6}" rx="14" ry="8" fill="#BDE5CF" stroke="#2F4858"/><ellipse cx="74" cy="${112-hh*.85}" rx="14" ry="8" fill="#BDE5CF" stroke="#2F4858"/>${p>=60?`<circle cx="60" cy="${112-hh-6}" r="9" fill="#FFE9A8" stroke="#2F4858"/>`:""}</svg><div><b>${d}/${tot} sets tried</b></div></div><div class="card w"><table><tr><th>Date</th><th>Set</th><th>Try</th><th>Score</th></tr>${a.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${e(x.set_title)}</td><td>${x.try}</td><td>${x.pct}% (${x.correct}/${x.total})</td></tr>`).join("")||`<tr><td colspan="4">No results yet.</td></tr>`}</table></div>`)}
async function writing(){sNav();sBind();const u=err(await SB.from("units").select("*").eq("published",true).not("writing_title","is",null).order("id")),w=err(await SB.from("writings").select("*").order("created_at",{ascending:false}));
h(`<h2>Writing Corner</h2>`+u.map(x=>`<div class="card"><b>${e(x.writing_title)}</b> <small>(${e(x.title)})</small><p><button class="btn go" data-u="${x.id}">Write</button></p></div>`).join("")+`<h3>My Writing</h3>`+(w.map(x=>`<div class="card"><b>${e(x.unit_title)}</b> · ${e(x.status)}<p>${e(x.body)}</p>${x.scores?`<p class="ok">Content ${x.scores.c}/5 · Organisation ${x.scores.o}/5 · Language ${x.scores.l}/5 · Total ${x.scores.c+x.scores.o+x.scores.l}/15</p>`:""}${x.feedback?`<p class="vi">${e(x.feedback)}</p>`:""}</div>`).join("")||"<p>Nothing yet.</p>"));
bind("[data-u]",b=>writeTask(u.find(x=>x.id==b.dataset.u)))}
function writeTask(u){sNav();sBind();const cr=[["Content","Did I answer all parts of the task?"],["Organisation","Did I use linking words (and, but, because) and a clear order? Hello/Bye if needed?"],["Language","Is my grammar, spelling and punctuation right? Did I use different words?"]];
h(`<h2>${e(u.writing_title)}</h2><div class="card"><p>${e(u.writing_prompt)}</p><textarea id="t" rows="8" aria-label="Your writing"></textarea><p id="wc">0 words</p></div><div class="card"><b>Self-check</b>${cr.map((c,i)=>`<p><label><input type="checkbox" style="width:auto"> <b>${c[0]}:</b> ${c[1]}</label><br>My rating: <select class="sr" style="width:auto">${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select> / 5</p>`).join("")}<button class="btn go" id="sub">Submit to teacher</button></div>`);
$("#t").oninput=()=>$("#wc").textContent=($("#t").value.trim()?$("#t").value.trim().split(/\s+/).length:0)+" words";
$("#sub").onclick=async()=>{const t=$("#t").value.trim();if(!t)return alert("Write your text first.");const s=[...A.querySelectorAll(".sr")].map(x=>+x.value);err(await SB.from("writings").insert({name:me.name,class:me.cls,unit_id:u.id,unit_title:u.title,body:t,self:{c:s[0],o:s[1],l:s[2]}}));alert("Sent! Status: Waiting for teacher.");writing()}}
function help(){sNav();sBind();h(`<div class="card"><h2>Help</h2><p>1. Open a unit. 2. Watch the video. 3. Do the exercises. 4. Check your answers and read the Vietnamese explanation.</p></div>`)}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<40;i++){const d=document.createElement("i");d.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:9px;height:9px;border-radius:3px;background:${["#BDE5CF","#FFE9A8","#FFB8A8","#A9D6F0"][i%4]};z-index:9;transition:transform 1.8s ease-in,opacity 1.8s`;document.body.append(d);requestAnimationFrame(()=>{d.style.transform=`translateY(105vh) rotate(${Math.random()*600}deg)`;d.style.opacity=0});setTimeout(()=>d.remove(),2000)}}
// ---------- TEACHER (#teacher) ----------
const tNav=()=>nav([["Dashboard",tDash],["Content",tContent],["Writing to grade",tWrite],["Classes",tClasses],["Log out",async()=>{await SB.auth.signOut();location.reload()}]]);
async function teacher(){const{data:{session}}=await SB.auth.getSession();if(session&&!session.user.is_anonymous){const t=await SB.from("teachers").select("uid");if(t.data&&t.data.length)return tDash()}
nav([]);h(`<div class="card"><h2>Teacher login</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p id="m" class="bad" hidden></p><button class="btn go" id="go">Log in</button></div>`);
$("#go").onclick=async()=>{const r=await SB.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error){$("#m").hidden=false;$("#m").textContent=r.error.message;return}const t=await SB.from("teachers").select("uid");if(t.data&&t.data.length)tDash();else{$("#m").hidden=false;$("#m").textContent="This account is not a teacher account.";await SB.auth.signOut()}}}
async function tDash(){tNav();const a=err(await SB.from("attempts").select("name,class,pct,created_at").order("created_at",{ascending:false}).limit(1000)),w=err(await SB.from("writings").select("id").eq("status","Waiting for teacher")),day=Date.now()-864e5,wk=Date.now()-6048e5,by={};a.forEach(x=>{(by[x.class]=by[x.class]||[]).push(x.pct)});
h(`<h2>Dashboard</h2><div class="card">Students: <b>${new Set(a.map(x=>x.class+x.name)).size}</b><br>Attempts (24 h): <b>${a.filter(x=>+new Date(x.created_at)>day).length}</b> · this week: <b>${a.filter(x=>+new Date(x.created_at)>wk).length}</b><br>Writing waiting: <b>${w.length}</b></div><div class="card"><b>Average % by class</b><table>${Object.entries(by).map(([c,v])=>`<tr><td>${e(c)}</td><td>${Math.round(v.reduce((s,n)=>s+n,0)/v.length)}%</td></tr>`).join("")||"<tr><td>No data yet</td></tr>"}</table></div>`)}
async function tContent(){tNav();const u=err(await SB.from("units").select("*").order("pos").order("id")),s=err(await SB.from("sets").select("*").order("level").order("id")),q=err(await SB.from("questions").select("id,set_id,prompt"));
h(`<h2>Content</h2>`+u.map(x=>`<div class="card"><b>${e(x.title)}</b> ${x.published?"":"(hidden)"}<br><button class="btn" data-tp="${x.id}">${x.published?"Hide":"Publish"}</button><button class="btn" data-du="${x.id}">Delete</button>${s.filter(y=>y.unit_id===x.id).map(y=>`<p>${["🌱","🌿","🌳"][y.level-1]||""} ${e(y.title)} (${q.filter(z=>z.set_id===y.id).length} questions) <button class="btn" data-ds="${y.id}">Delete set</button></p>`).join("")}</div>`).join("")+
`<div class="card"><b>Add unit</b><input id="ut" placeholder="Title"><input id="uv" placeholder="Video link (YouTube embed URL)"><textarea id="un" placeholder="Grammar notes"></textarea><input id="wt" placeholder="Writing task title (optional)"><textarea id="wp" placeholder="Writing task prompt"></textarea><button class="btn go" id="au">Add unit</button></div>
<div class="card"><b>Add exercise set</b><select id="su">${u.map(x=>`<option value="${x.id}">${e(x.title)}</option>`).join("")}</select><input id="st" placeholder="Set title"><select id="sl"><option value="1">🌱 Easy</option><option value="2">🌿 Medium</option><option value="3">🌳 Hard</option></select><button class="btn go" id="as">Add set</button></div>
<div class="card"><b>Add question</b><select id="qs">${s.map(x=>`<option value="${x.id}">${e(x.title)}</option>`).join("")}</select><select id="qt"><option value="mc">Multiple choice</option><option value="tf">True / False</option><option value="fill">Fill in the blank</option></select><textarea id="qp" placeholder="Question"></textarea><input id="qo" placeholder="Options (multiple choice): go, goes, is going"><input id="qa" placeholder="Correct answer(s), separate with |"><textarea id="qv" placeholder="Giải thích tiếng Việt"></textarea><button class="btn go" id="aq">Add question</button></div>`);
const refresh=tContent;
bind("[data-tp]",async b=>{const x=u.find(y=>y.id==b.dataset.tp);err(await SB.from("units").update({published:!x.published}).eq("id",x.id));refresh()});
bind("[data-du]",async b=>{if(confirm("Delete this unit and everything in it?")){err(await SB.from("units").delete().eq("id",b.dataset.du));refresh()}});
bind("[data-ds]",async b=>{if(confirm("Delete this set and its questions?")){err(await SB.from("sets").delete().eq("id",b.dataset.ds));refresh()}});
$("#au").onclick=async()=>{if(!$("#ut").value.trim())return;err(await SB.from("units").insert({title:$("#ut").value.trim(),video:$("#uv").value.trim()||null,notes:$("#un").value,writing_title:$("#wt").value.trim()||null,writing_prompt:$("#wp").value}));refresh()};
$("#as").onclick=async()=>{if(!$("#st").value.trim()||!$("#su").value)return;err(await SB.from("sets").insert({unit_id:+$("#su").value,title:$("#st").value.trim(),level:+$("#sl").value}));refresh()};
$("#aq").onclick=async()=>{if(!$("#qp").value.trim()||!$("#qs").value||!$("#qa").value.trim())return;const t=$("#qt").value;err(await SB.from("questions").insert({set_id:+$("#qs").value,type:t,prompt:$("#qp").value.trim(),options:t==="mc"?$("#qo").value.split(",").map(x=>x.trim()).filter(Boolean):null,answers:$("#qa").value.split("|").map(x=>x.trim()).filter(Boolean),explanation_vi:$("#qv").value}));refresh()}}
async function tWrite(){tNav();const w=err(await SB.from("writings").select("*").order("created_at",{ascending:false}).limit(50));
h(`<h2>Writing to grade</h2>`+(w.map(x=>`<div class="card"><b>${e(x.name)}</b> (${e(x.class)}) · ${e(x.unit_title)} · ${e(x.status)}<p>${e(x.body)}</p><small>Self-rating: C ${x.self?.c} / O ${x.self?.o} / L ${x.self?.l}</small><br>Content <input class="g" type="number" min="0" max="5" value="${x.scores?.c??""}" style="width:70px"> Organisation <input class="g" type="number" min="0" max="5" value="${x.scores?.o??""}" style="width:70px"> Language <input class="g" type="number" min="0" max="5" value="${x.scores?.l??""}" style="width:70px"><textarea class="f" placeholder="Feedback">${e(x.feedback||"")}</textarea><button class="btn go" data-g="${x.id}">Save grade</button></div>`).join("")||"<p>No writing yet.</p>"));
bind("[data-g]",async b=>{const c=b.parentNode,g=[...c.querySelectorAll(".g")].map(i=>Math.min(5,Math.max(0,+i.value||0)));err(await SB.from("writings").update({scores:{c:g[0],o:g[1],l:g[2]},feedback:c.querySelector(".f").value,status:"Marked"}).eq("id",b.dataset.g));alert("Saved");tWrite()})}
async function tClasses(){tNav();const c=err(await SB.from("classes").select("*").order("name"));
h(`<h2>Classes</h2><div class="card">${c.map(x=>`<p>${e(x.name)} <button class="btn" data-dc="${x.id}">Delete</button></p>`).join("")}<input id="cn" placeholder="New class, e.g. 7C"><button class="btn go" id="ac">Add class</button></div>`);
bind("[data-dc]",async b=>{if(confirm("Delete this class?")){err(await SB.from("classes").delete().eq("id",b.dataset.dc));tClasses()}});
$("#ac").onclick=async()=>{if(!$("#cn").value.trim())return;err(await SB.from("classes").insert({name:$("#cn").value.trim()}));tClasses()}}
// ---------- START ----------
addEventListener("hashchange",()=>location.reload());
(async()=>{if(location.hash==="#teacher")return teacher();const{data:{session}}=await SB.auth.getSession();if(!session||!session.user.is_anonymous){if(session)await SB.auth.signOut();const r=await SB.auth.signInAnonymously();if(r.error){h(`<div class="card bad">Cannot connect: ${e(r.error.message)}</div>`);return}}me.name&&me.cls?home():who()})();
</script></body></html>
